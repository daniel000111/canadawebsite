<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTE Canada - Login</title>
  <link rel="icon" href="assets/logo-square.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <header class="panel-topbar">
    <a href="index.html" class="brand panel-topbar-brand" aria-label="BTE Canada home">
      <img src="assets/logo-square.png" alt="BTE Canada Logo" class="nav-logo" />
      <span class="brand-text">BTE CANADA</span>
    </a>
  </header>
  <main class="login-page">
    <section class="login-hero">
      <div class="login-panel-wrap">
        <div class="login-panel" id="loginPanel">
          <a class="login-home-btn" href="index.html" aria-label="Go home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </a>
          <div class="login-logo">
            <img src="assets/logo-square.png" alt="BTE Canada Logo" />
          </div>
          <h2>Welcome back.</h2>
          <p class="section-text">Log in to continue.</p>
          <button class="cta-btn login-discord-btn" id="discordLogin" type="button">
            <svg class="discord-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.317 4.369a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0c-.164-.385-.397-.874-.608-1.249a.077.077 0 0 0-.079-.037A19.736 19.791 0 0 0 3.683 4.37a.07.07 0 0 0-.032.027C.533 9.045-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.461-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.371-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.245.197.372.291a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.106c.36.699.772 1.364 1.225 1.994a.076.076 0 0 0 .084.028 19.9 19.9 0 0 0 5.994-3.03.077.077 0 0 0 .03-.056c.5-5.177-.838-9.673-3.548-13.66a.061.061 0 0 0-.031-.03z"/>
            </svg>
            <span>Continue with Discord</span>
          </button>
          <p class="docs-note" id="loginStatus"></p>
        </div>

        <div class="login-session-flow" id="loginSessionFlow" hidden>
          <div id="loginVerifyAnimation" class="verify-animation login-verify-animation verify-pop" aria-live="polite" hidden>
            <span class="verify-spinner" aria-hidden="true"></span>
            <svg class="verify-check" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="#3bc26d" stroke-width="2.5"></circle>
              <path d="M7.5 12.3l3.1 3.2 6-6.2" fill="none" stroke="#3bc26d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script>
    (function () {
      const supabaseConfig = window.APP_SUPABASE || {};
      const sbClient = window.APP_SUPABASE_CLIENT || window.supabase?.createClient(supabaseConfig.url, supabaseConfig.key);

      const btn = document.getElementById("discordLogin");
      const status = document.getElementById("loginStatus");
      const loginPanelWrap = document.querySelector(".login-panel-wrap");
      const loginPanel = document.getElementById("loginPanel");
      const sessionFlow = document.getElementById("loginSessionFlow");
      const loginVerifyAnimation = document.getElementById("loginVerifyAnimation");

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function playVerifyAnimation() {
        if (!loginVerifyAnimation) return;
        loginVerifyAnimation.hidden = false;
        loginVerifyAnimation.classList.add("is-visible");
        loginVerifyAnimation.classList.remove("is-success");
        await delay(900);
        loginVerifyAnimation.classList.add("is-success");
        await delay(760);
      }

      async function redirectToPanelIfLoggedIn() {
        if (!sbClient || !loginPanel || !sessionFlow) return;
        const { data } = await sbClient.auth.getSession();
        if (!data?.session) return;

        loginPanel.classList.add("is-hidden");
        loginPanelWrap?.classList.add("session-active");
        sessionFlow.hidden = false;
        await playVerifyAnimation();
        window.location.href = "panel.html";
      }

      btn.addEventListener("click", async () => {
        if (!sbClient) {
          status.textContent = "Supabase failed to load. Please refresh and try again.";
          return;
        }
        btn.disabled = true;
        status.textContent = "Redirecting to Discord...";
        const redirectTo = `${window.location.origin}${window.location.pathname}`;
        const { error } = await sbClient.auth.signInWithOAuth({
          provider: "discord",
          options: { redirectTo }
        });
        if (error) {
          console.error("Discord login failed:", error);
          status.textContent = `Login failed: ${error.message}`;
          btn.disabled = false;
        }
      });

      redirectToPanelIfLoggedIn();
    })();
  </script>
</body>
</html>
